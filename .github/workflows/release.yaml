name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the latest release, or release the exact version below (version)
        type: choice
        options: [version, patch, minor, major]
        default: version
      version:
        description: Exact version to release, X.Y.Z (only with bump set to version)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  # No write access: building runs the dependencies' build scripts and proc macros.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Pick the version
        id: version
        uses: sagikazarmark/next-version@fc0401d3719a172991c36ec41f5e43419c30e90f # v0.3.0
        with:
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}
          allow-prerelease: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Bump the version
        run: cargo release version --execute --no-confirm "${{ steps.version.outputs.version }}"

      - name: Dry run publish
        run: cargo publish --dry-run --workspace --locked --allow-dirty

  bump:
    name: Bump
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Set up git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump
        id: bump
        run: |
          cargo release version --execute --no-confirm "${{ needs.prepare.outputs.version }}"

          if ! git diff --quiet; then
            cargo release commit --execute --no-confirm
          fi

          # Always runs: it is the default-branch check, and pushes nothing when there is nothing new.
          cargo release push --no-tag --execute --no-confirm --allow-branch "${{ github.event.repository.default_branch }}"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    needs: bump
    runs-on: ubuntu-latest
    environment: crates

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Detached HEAD at the Bump commit (branch already checked), and Prepare already built the packages.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo release publish --workspace --no-verify --allow-branch HEAD --execute --no-confirm

  release:
    name: GitHub Release
    needs: [prepare, bump, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.prepare.outputs.tag }}" --target "${{ needs.bump.outputs.sha }}" --generate-notes --prerelease="${{ needs.prepare.outputs.prerelease }}"
